# Landing page statica di Primo Passo: nessuna compilazione, si pubblica la cartella site/ così com'è.
# (La demo dell'interfaccia in React è conservata nel ramo demo-lovable e nel tag demo-lovable-v1.)
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara la cartella da pubblicare (solo la pagina e i suoi file)
        run: |
          mkdir -p _site
          cp index.html pino.js pino.css favicon.svg cover.jpg _site/
          touch _site/.nojekyll
      - name: Controllo chiavi e credenziali
        run: |
          if grep -rIEn "(sk-[A-Za-z0-9]{20,}|sk_live_[A-Za-z0-9]+|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AIza[0-9A-Za-z_-]{30,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" _site; then
            echo "Trovata una possibile chiave: non pubblico."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
